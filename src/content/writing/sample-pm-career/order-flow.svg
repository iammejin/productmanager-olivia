<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" font-family="'Comic Sans MS', 'Trebuchet MS', sans-serif" font-size="16">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 11 6 L 0 12 z" fill="#1A1A1A"></path>
    </marker>
  </defs>

  <!-- Sources (left column) -->
  <rect x="20" y="20" width="160" height="56" rx="6" ry="6" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"></rect>
  <text x="100" y="54" text-anchor="middle" fill="#1A1A1A">주문 도메인</text>

  <rect x="22" y="110" width="160" height="56" rx="6" ry="6" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"></rect>
  <text x="102" y="144" text-anchor="middle" fill="#1A1A1A">배달 도메인</text>

  <rect x="18" y="200" width="160" height="56" rx="6" ry="6" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"></rect>
  <text x="98" y="234" text-anchor="middle" fill="#1A1A1A">픽업 도메인</text>

  <!-- Center hub -->
  <rect x="300" y="100" width="180" height="80" rx="6" ry="6" fill="#FFE8D6" stroke="#FF6B1A" stroke-width="2.5" stroke-linejoin="round"></rect>
  <text x="390" y="135" text-anchor="middle" fill="#1A1A1A" font-weight="700">주문 중계 플랫폼</text>
  <text x="390" y="158" text-anchor="middle" fill="#5C5C5C" font-size="13">단일 표준 스펙</text>

  <!-- Targets (right column) -->
  <rect x="600" y="20" width="140" height="56" rx="6" ry="6" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"></rect>
  <text x="670" y="54" text-anchor="middle" fill="#1A1A1A">라이더 배차</text>

  <rect x="602" y="110" width="140" height="56" rx="6" ry="6" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"></rect>
  <text x="672" y="144" text-anchor="middle" fill="#1A1A1A">CS · 안심번호</text>

  <rect x="598" y="200" width="140" height="56" rx="6" ry="6" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"></rect>
  <text x="668" y="234" text-anchor="middle" fill="#1A1A1A">정산 · 리포트</text>

  <!-- Arrows: sources → hub -->
  <path d="M 182 48 Q 240 70 300 120" fill="none" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"></path>
  <path d="M 182 138 L 300 140" fill="none" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"></path>
  <path d="M 180 226 Q 240 200 300 160" fill="none" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"></path>

  <!-- Arrows: hub → targets -->
  <path d="M 480 120 Q 540 80 600 48" fill="none" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"></path>
  <path d="M 480 140 L 602 138" fill="none" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"></path>
  <path d="M 480 160 Q 540 200 598 226" fill="none" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"></path>
</svg>
